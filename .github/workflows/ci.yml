name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phone-tests:
    name: Phone UI Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: cd apps/phone && pnpm install --frozen-lockfile --ignore-workspace
      - run: cd apps/phone && pnpm exec vitest run

  identity-svc-tests:
    name: Identity Service Tests (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24        # node:sqlite 需 22.5+（本地开发 Node 25；20 无此内建模块）
      - run: cd services/identity-svc && npm install --no-audit --no-fund
      - run: cd services/identity-svc && node --test

  home-ui-tests:
    name: Home UI Tests (Vitest, pnpm workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/home/ui exec vitest run

  rust-tests:
    name: Rust Tests (cargo test, GUI variant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/home/ui build
      - run: pnpm --dir apps/media/ui build
      - uses: dtolnay/rust-toolchain@stable
      - run: cd apps/home/src-tauri && cargo test --workspace
