[workspace]
resolver = "2"
members = [
    "core/protocol",
    "core/transport",
    "core/runtime",
    "core/pomdp",
    "core/aop",
    "core/dialog",
    "core/discovery",
    "core/discovery-proto",
    "core/myco-core",
    "core/storage",
    "core/terminal-proto",
    "apps/home/src-tauri",
    "apps/media/src-tauri",
    "apps/ui-agents/embed-server",
]

[workspace.package]
version = "0.3.199"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/youling-cc/myco"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ZeroMQ
zeromq = "0.3"

# Parsing
gray_matter = "0.2"
markdown = "1.0"

# Utils
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Internal crates
myco-protocol = { path = "core/protocol" }
myco-transport = { path = "core/transport" }
myco-agent = { path = "core/runtime" }
myco-pomdp = { path = "core/pomdp" }
myco-storage = { path = "core/storage" }
myco-terminal-proto = { path = "core/terminal-proto" }

[profile.release]
lto = true
codegen-units = 1

