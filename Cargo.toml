[workspace]
resolver = "2"
members = [
    "core/protocol",
    "core/transport",
    "core/runtime",
    "core/pomdp",
    "core/aop",
    "core/dialog",
    "core/discovery",
    "core/discovery-proto",
    "core/myco-core",
    "core/storage",
    "core/terminal-proto",
    "apps/home/src-tauri",
    "apps/media/src-tauri",
    "apps/ui-agents/embed-server",
]

[workspace.package]
version = "0.3.199"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/youling-cc/myco"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ZeroMQ
zeromq = "0.3"

# Parsing
gray_matter = "0.2"
markdown = "1.0"

# Utils
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Internal crates
myco-protocol = { path = "core/protocol" }
myco-transport = { path = "core/transport" }
myco-agent = { path = "core/runtime" }
myco-pomdp = { path = "core/pomdp" }
myco-storage = { path = "core/storage" }
myco-terminal-proto = { path = "core/terminal-proto" }

[profile.release]
lto = true
codegen-units = 1

# Vendored forks of webrtc-rs: enables IPv6 host candidates (set_network_types
# with Udp4/Udp6) and fixes ifaces feature for our P2P direct-connect paths.
[patch.crates-io]
webrtc-util = { path = "patches/webrtc-util" }
webrtc-ice = { path = "patches/webrtc-ice" }
# Vendored zeromq fork: fixes todo!() panic on client disconnect in REP socket
# (dead-peer removal; NoMessage semantics for control frames; queue-close
# handling; unknown-send peer eviction) -- required for long-running agent
# process stability.
zeromq = { path = "patches/zeromq" }
