<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>myco 远程</title>
<style>
  :root { --bg:#0d1117; --bg2:#161b22; --bg3:#1c2333; --border:#2d333b; --text:#e6edf3; --muted:#8b949e; --accent:#6b7bff; --ok:#66bb6a; }
  :root[data-theme="light"] { --bg:#f6f7f9; --bg2:#ffffff; --bg3:#eef0f4; --border:#dde1e8; --text:#1f2430; --muted:#6a7385; --accent:#5865d6; --ok:#3d9e47; }
  /* 主题化滚动条(用户实测 term 滚动条主题不对):thumb/track 全吃主题变量 */
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--bg3, #1c2333); border: 2px solid transparent; background-clip: padding-box; border-radius: 5px; }
  *::-webkit-scrollbar-thumb:hover { background: var(--muted, #8b949e); border: 2px solid transparent; background-clip: padding-box; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font:13px/1.6 "Segoe UI","Microsoft YaHei",sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; user-select:none; }
  #root { display:flex; flex-direction:column; height:100vh; }
  .stage { flex:1; display:flex; flex-direction:column; min-height:0; }
  .video-wrap { flex:1; margin:12px 14px; border:1px dashed var(--border); border-radius:12px; background:var(--bg2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--muted); }
  .video-wrap .glyph { font-size:28px; }
  .video-wrap .hint { font-size:11px; }
  .dev-list { margin:0 14px 12px; border:1px solid var(--border); border-radius:12px; background:var(--bg2); overflow:hidden; }
  .dev-head { display:flex; align-items:center; padding:8px 12px; border-bottom:1px solid var(--border); font-size:11px; color:var(--muted); }
  .dev-head .flex1 { flex:1; }
  .dev-row { display:flex; align-items:center; gap:8px; padding:8px 12px; border-top:1px solid var(--border); font-size:12px; }
  .dev-row:first-of-type { border-top:none; }
  .dev-row .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .dot.on { background:var(--ok); }
  .badge { font-size:9px; padding:1px 6px; border-radius:8px; background:var(--bg3); color:var(--muted); }
  .badge.ok { background:rgba(102,187,106,.15); color:var(--ok); }
  .empty { padding:14px; text-align:center; color:var(--muted); font-size:11px; }
  /* 直播态满铺(2026-08-31,屏占比目标):零边距零边框,画面贴到窗口缘,不留无视频内容的边 */
  .video-wrap.live { margin:0; border:none; border-radius:0; padding:0; overflow:hidden; position:relative; }
  /* RDP 式 IME 捕获框:隐形常驻于画面区,聚焦即可本地组字 */
  .video-wrap .ime-catcher { position:absolute; left:0; bottom:0; width:2px; height:2px; opacity:0; border:none; background:transparent; color:transparent; caret-color:transparent; padding:0; }
  .video-wrap .screen { width:100%; height:100%; object-fit:fill; background:#000; cursor:default; outline:none; }
  /* 全屏覆盖(2026-08-28):纯 CSS,浏览器 Fullscreen API 在 Tauri WebView 不可靠故弃用 */
  .stage.fs { position:fixed; inset:0; z-index:40; background:#000; }
  .stage.fs .video-wrap { margin:0; border:none; border-radius:0; }
  .ctl-row { display:flex; align-items:center; gap:8px; margin:0 14px 8px; padding:6px 10px; border:1px solid var(--border); border-radius:10px; background:var(--bg2); font-size:11px; color:var(--muted); }
  .ctl-row.sub { margin-top:-2px; }
  .ctl-row .flex1 { flex:1; }
  .ctl-text { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btn { font-size:11px; padding:2px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg3); color:var(--text); cursor:pointer; }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn.accent { background:var(--accent); border-color:var(--accent); color:#fff; }
  footer { padding:8px 14px; font-size:10px; color:var(--muted); border-top:1px solid var(--border); background:var(--bg2); }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
