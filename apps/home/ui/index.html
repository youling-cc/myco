<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>myco</title>
<style>
  :root { --bg:#0d1117; --bg2:#161b22; --bg3:#1c2333; --border:#2d333b; --text:#e6edf3; --muted:#8b949e; --ok:#66bb6a; --run:#4fc3f7; --fail:#ef5350;
          /* 短名别名(FleetStrip/折叠钮等内联样式用;浅色曾缺定义→深色兜底近白贴浅底=隐形) */
          --tx:#e6edf3; --bd:#2d333b; --ac:#6b7bff; --mu:#8b949e; }
  /* 浅色主题(全 UI agent 统一:暖白纸面+墨色文字+同品牌蓝绿) */
  :root[data-theme="light"] { --bg:#f6f7f9; --bg2:#ffffff; --bg3:#eef0f4; --border:#dde1e8; --text:#1f2430; --muted:#6a7385; --ok:#3d9e47; --run:#1a8fc5; --fail:#d5473e;
          --tx:#1f2430; --bd:#c9cfda; --ac:#4a5ae0; --mu:#5a6376; }
  /* 主题化滚动条(用户实测 term 滚动条主题不对):thumb/track 全吃主题变量 */
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--bg3, #1c2333); border: 2px solid transparent; background-clip: padding-box; border-radius: 5px; }
  *::-webkit-scrollbar-thumb:hover { background: var(--muted, #8b949e); border: 2px solid transparent; background-clip: padding-box; }
  * { margin:0; padding:0; box-sizing:border-box; }
  #root { display:flex; flex-direction:column; flex:1 1 0%; min-height:0; }
  body { background:var(--bg); color:var(--text); font:12px/1.55 "Segoe UI","Microsoft YaHei",sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; user-select:none; }
  header { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--border); background:var(--bg2); cursor:default; }
  header .logo { width:18px; height:18px; border-radius:5px; background:linear-gradient(135deg,#6b7bff,#4ec9a5); }
  header h1 { font-size:12.5px; flex:1; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--muted); }
  .dot.on { background:var(--ok); }
  .minibar { display:flex; align-items:center; gap:6px; justify-content:center; padding:6px; font-size:10px; color:var(--muted); cursor:pointer; }
  main { flex:1; overflow-y:auto; padding:8px; }
  .proj { margin-bottom:10px; border:1px solid var(--border); border-radius:10px; background:var(--bg2); overflow:hidden; }
  .proj-h { padding:7px 10px; background:var(--bg3); display:flex; align-items:center; gap:6px; }
  .proj-h .name { font-size:12px; font-weight:600; flex:1; }
  .proj-h .badge { font-size:9px; padding:1px 6px; border-radius:8px; background:rgba(107,123,255,.15); color:#6b7bff; }
  .task-title { padding:5px 10px 0; font-size:10.5px; color:var(--muted); }
  .sub { display:flex; align-items:center; gap:6px; padding:4px 10px; border-top:1px solid rgba(45,51,59,.4); }
  .sub:first-of-type { border-top:none; }
  .st { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .st.completed { background:var(--ok); }
  .st.running { background:var(--run); }
  .st.failed { background:var(--fail); }
  .st.pending { background:#5a6472; }
  .sub .layer { font-size:9px; font-weight:700; width:10px; text-align:center; }
  .layer-P { color:#4fc3f7; } .layer-C { color:#b388ff; } .layer-D { color:#ffb74d; } .layer-A { color:#4db6ac; } .layer-T { color:#90a4ae; } .layer-R { color:#ef5350; }
  .sub .title { flex:1; font-size:11px; }
  .sub .slug { font-size:9px; color:var(--muted); font-family:Consolas,monospace; }
  main.col { flex:1; overflow:hidden; padding:6px; display:flex; flex-direction:column; gap:6px; }
  .sec { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; }
  .sec.grow { flex:1; min-height:0; overflow-y:auto; }  /* max-height 删——项目列表填满剩余空间,不再留大片空白 */
  .sec-title { font-size:11px; font-weight:700; color:var(--text); margin-bottom:5px; display:flex; align-items:center; gap:6px; }
  .row { display:flex; align-items:center; gap:6px; margin:3px 0; }
  .row .name { font-size:11.5px; color:var(--text); }
  .muted { color:var(--muted); font-size:10px; }
  .small { font-size:10px; }
  .flex1 { flex:1; min-width:0; }
  .truncate { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .soul { font-size:11px; font-weight:800; color:#6b7bff; }
  .warn { color:var(--fail); font-weight:700; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .dot.on { background:var(--ok); }
  .tag { font-size:9px; font-weight:700; padding:0 5px; border-radius:8px; flex-shrink:0; }
  .tag.PA { background:rgba(107,123,255,.16); color:#6b7bff; }
  .tag.P { background:rgba(78,201,165,.14); color:#4ec9a5; }
  .tag.A { background:rgba(255,183,77,.14); color:#ffb74d; }
  .chip { font-size:9.5px; padding:2px 8px; border-radius:9px; border:1px solid var(--border); background:var(--bg3); color:var(--muted); cursor:pointer; }
  .chip.on { border-color:#6b7bff; color:#6b7bff; }
  input { flex:1; min-width:0; padding:6px 9px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font:inherit; }
  .row button:not(.chip) { padding:6px 12px; border-radius:8px; border:none; background:linear-gradient(135deg,#6b7bff,#4ec9a5); color:#fff; font-weight:700; cursor:pointer; }
  .lt { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .lt-red { background:#ef5350; } .lt-yellow { background:#e8c468; } .lt-green { background:#66bb6a; }
  .lt-gray { background:#5a6472; } .lt-blue { background:#4fc3f7; }
  /* B2.5 合并视图:项目组展开/收起 + 待办子行 + 勾选圈 */
  .caret { width:11px; font-size:11px; color:var(--tx, var(--muted)); flex-shrink:0; transition:transform .15s; }
  /* 浅色主题微导航图标加粗一档:12px 细线在暖白底上抗锯齿后观感偏灰(k3 实测) */
  [data-theme="light"] .fleetbtn svg { stroke-width:3; }
  .grp.closed .caret { transform:rotate(-90deg); }
  .grp.closed .todo-sub { display:none; }
  .todo-sub { margin-left:12px; padding-left:9px; border-left:1px solid var(--border); }
  .chk { width:13px; height:13px; border-radius:50%; border:1.5px solid var(--muted); flex-shrink:0; cursor:pointer; }
  .chk:hover { border-color:var(--ok); }
  .due { font-size:9.5px; color:var(--muted); white-space:nowrap; }
  .due.red { color:var(--fail); } .due.yellow { color:#e8c468; }
  /* B2.5 内嵌助手迷你卡 */
  .chat-log { display:flex; flex-direction:column; gap:5px; max-height:160px; overflow-y:auto; margin-bottom:6px; }
  .msg { max-width:88%; padding:5px 9px; border-radius:9px; font-size:11px; white-space:pre-wrap; user-select:text; }
  .msg.me { align-self:flex-end; background:#6b7bff; color:#fff; border-bottom-right-radius:3px; }
  .msg.ai { align-self:flex-start; background:var(--bg3); border-bottom-left-radius:3px; }
  .empty { padding:40px 16px; text-align:center; color:var(--muted); font-size:11px; }
  footer { padding:6px 12px; font-size:9px; color:var(--muted); border-top:1px solid var(--border); background:var(--bg2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
